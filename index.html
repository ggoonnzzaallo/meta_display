<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=600, height=600, initial-scale=1.0, user-scalable=no">
  <meta name="description" content="G-Apps launcher for Meta Ray-Ban Display web apps hosted from this GitHub repo.">
  <meta name="mrbd-web-app-capable" content="yes">
  <title>G-Apps</title>
  <link rel="icon" type="image/png" href="/meta_display/favicon.png">
  <link rel="icon" type="image/png" sizes="96x96" href="/meta_display/icon-96.png">
  <link rel="icon" type="image/png" sizes="128x128" href="/meta_display/icon-128.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/meta_display/favicon.png">
  <link rel="apple-touch-icon" href="/meta_display/apple-touch-icon.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/meta_display/apple-touch-icon.png">
  <link rel="manifest" href="/meta_display/manifest.webmanifest">
  <meta property="og:image" content="https://gonzalobuilds.com/meta_display/favicon.png">
  <meta property="og:image:type" content="image/png">
  <meta property="og:image:width" content="192">
  <meta property="og:image:height" content="192">
  <meta name="msapplication-TileImage" content="https://gonzalobuilds.com/meta_display/apple-touch-icon.png">
  <meta name="msapplication-TileColor" content="#007AA8">
  <link rel="stylesheet" href="styles.css?v=11">
</head>
<body>
  <div id="app">
    <section id="home" class="screen" aria-label="G-Apps launcher">
      <header class="header">
        <div class="header-brand">
          <span class="logo-mark" aria-hidden="true">G</span>
          <h1>G-Apps</h1>
        </div>
        <span id="clock" class="header-meta">--:--</span>
      </header>
      <div class="content">
        <p class="lede">Arrow keys to choose an app. Enter to open it.</p>
        <div id="app-list"></div>
      </div>
    </section>
  </div>
  <script src="app.js?v=29"></script>
</body>
</html>
