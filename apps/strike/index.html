<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=600, height=600, initial-scale=1.0, user-scalable=no">
  <meta name="description" content="See-through HUD: look at the real world, pinch to fire. Three shots, then reload.">
  <meta name="mrbd-web-app-capable" content="yes">
  <title>STRIKE v1</title>
  <link rel="icon" type="image/png" href="/meta_display/apps/strike/favicon.png">
  <link rel="icon" type="image/png" sizes="96x96" href="/meta_display/apps/strike/icon-96.png">
  <link rel="icon" type="image/png" sizes="128x128" href="/meta_display/apps/strike/icon-128.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/meta_display/apps/strike/favicon.png">
  <link rel="apple-touch-icon" href="/meta_display/apps/strike/apple-touch-icon.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/meta_display/apps/strike/apple-touch-icon.png">
  <link rel="manifest" href="/meta_display/apps/strike/manifest.webmanifest">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <section id="home" class="screen" aria-label="STRIKE title">
      <div class="title-block">
        <p class="title-tag">LOOK · FIRE · RELOAD</p>
        <h1>STRIKE</h1>
        <p class="best-readout">BUILD v1</p>
        <p id="best-readout" class="best-readout">BEST 00000</p>
      </div>
      <div class="menu">
        <button class="focusable" data-action="play">PLAY</button>
        <button class="focusable" data-action="how">HOW</button>
      </div>
    </section>

    <section id="how" class="screen hidden" aria-label="How to play">
      <header class="header">
        <h1>HOW</h1>
      </header>
      <div class="content">
        <ul class="facts">
          <li>Look at something in the world. The pipper is your aim.</li>
          <li>Pinch or Enter fires a missile at that spot.</li>
          <li>Three shots, then Enter reloads. Escape pauses.</li>
        </ul>
        <button class="focusable" data-action="home">BACK</button>
      </div>
    </section>

    <section id="play" class="screen screen-play hidden" aria-label="HUD">
      <canvas id="hud" width="600" height="600"></canvas>
      <button id="fire-btn" class="focusable fire-hotspot" data-action="fire" aria-label="Fire"></button>
      <div id="pause-overlay" class="overlay hidden">
        <div class="panel">
          <h2>PAUSED</h2>
          <button class="focusable" data-action="resume">RESUME</button>
          <button class="focusable" data-action="quit">QUIT</button>
        </div>
      </div>
    </section>
  </div>
  <script src="app.js"></script>
</body>
</html>
