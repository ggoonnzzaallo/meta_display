<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=600, height=600, initial-scale=1.0, user-scalable=no">
  <meta name="description" content="Probe camera, microphone, and location APIs on Meta Ray-Ban Display glasses.">
  <meta name="mrbd-web-app-capable" content="yes">
  <title>IO Probe</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <section id="home" class="screen" aria-label="IO Probe">
      <header class="header">
        <h1>IO Probe</h1>
        <span class="clock header-meta">--:--</span>
      </header>
      <div class="content">
        <p id="env-line" class="lede">Checking APIs…</p>
        <button class="focusable probe-row" data-action="test-camera">
          <span class="probe-name">Camera</span>
          <span class="probe-status" id="status-camera">—</span>
        </button>
        <button class="focusable probe-row" data-action="test-mic">
          <span class="probe-name">Microphone</span>
          <span class="probe-status" id="status-mic">—</span>
        </button>
        <button class="focusable probe-row" data-action="test-location">
          <span class="probe-name">Location</span>
          <span class="probe-status" id="status-location">—</span>
        </button>
        <div class="result-card">
          <video id="preview" class="hidden" muted playsinline autoplay></video>
          <p id="result-text">Pinch a row to request that I/O. On-device, camera, mic, and location have all returned live data.</p>
        </div>
      </div>
    </section>
  </div>
  <script src="app.js"></script>
</body>
</html>
