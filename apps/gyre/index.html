<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=600, height=600, initial-scale=1.0, user-scalable=no">
  <meta name="description" content="Rotate with left and right to slip through closing square walls.">
  <meta name="mrbd-web-app-capable" content="yes">
  <title>GYRE v6</title>
  <link rel="icon" href="favicon.png" sizes="128x128" type="image/png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles.css?v=6">
</head>
<body>
  <div id="app">
    <section id="home" class="screen" aria-label="GYRE title">
      <div class="title-block">
        <p class="title-tag">ROTATE · DODGE</p>
        <h1>GYRE</h1>
        <p class="best-readout">BUILD v6</p>
        <p id="best-readout" class="best-readout">BEST 00000</p>
      </div>
      <div class="menu">
        <button class="focusable" data-action="play">PLAY</button>
        <button class="focusable" data-action="how">HOW</button>
      </div>
    </section>

    <section id="how" class="screen hidden" aria-label="How to play">
      <header class="header">
        <h1>HOW</h1>
      </header>
      <div class="content">
        <ul class="facts">
          <li>Tap left or right to rotate one face. Up and down work too.</li>
          <li>Four sides. Aim for the green gap. Amber walls crush you.</li>
          <li>Walls start slow, then close in. One hit ends the run. Back pauses.</li>
        </ul>
        <button class="focusable" data-action="home">BACK</button>
      </div>
    </section>

    <section id="play" class="screen screen-play hidden" aria-label="HUD">
      <canvas id="hud" width="600" height="600"></canvas>
      <button id="play-btn" class="focusable play-hotspot" data-action="hold" aria-label="Play"></button>
      <div id="pause-overlay" class="overlay hidden">
        <div class="panel">
          <h2>PAUSED</h2>
          <button class="focusable" data-action="resume">RESUME</button>
          <button class="focusable" data-action="quit">QUIT</button>
        </div>
      </div>
    </section>

    <section id="over" class="screen hidden" aria-label="Crushed">
      <header class="header">
        <h1>CRUSHED</h1>
      </header>
      <div class="content">
        <p id="over-stats" class="over-stats">SCORE 00000<br>BEST 00000</p>
        <button class="focusable" data-action="again">AGAIN</button>
        <button class="focusable" data-action="home">HOME</button>
      </div>
    </section>
  </div>
  <script src="app.js?v=6"></script>
</body>
</html>
