<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=600, height=600, initial-scale=1.0, user-scalable=no">
  <meta name="description" content="Pinch and drag to trace an outline. Stay close for a higher score.">
  <meta name="mrbd-web-app-capable" content="yes">
  <title>TRACE v12</title>
  <link rel="icon" type="image/png" href="/meta_display/apps/trace/favicon.png">
  <link rel="icon" type="image/png" sizes="96x96" href="/meta_display/apps/trace/icon-96.png">
  <link rel="icon" type="image/png" sizes="128x128" href="/meta_display/apps/trace/icon-128.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/meta_display/apps/trace/favicon.png">
  <link rel="apple-touch-icon" href="/meta_display/apps/trace/apple-touch-icon.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/meta_display/apps/trace/apple-touch-icon.png">
  <link rel="manifest" href="/meta_display/apps/trace/manifest.webmanifest">
  <link rel="stylesheet" href="styles.css?v=12">
</head>
<body>
  <div id="app">
    <section id="home" class="screen" aria-label="TRACE title">
      <div class="title-block">
        <p class="title-tag">PINCH · DRAW</p>
        <h1>TRACE</h1>
        <p class="best-readout">BUILD v12</p>
        <p id="best-readout" class="best-readout">BEST --</p>
      </div>
      <div class="menu">
        <button class="focusable" type="button" data-action="play">PLAY</button>
        <button class="focusable" type="button" data-action="how">HOW</button>
      </div>
    </section>

    <section id="how" class="screen hidden" aria-label="How to play">
      <header class="header">
        <h1>HOW</h1>
      </header>
      <div class="content">
        <ul class="facts">
          <li>The pencil starts on the glowing dot. Pinch, hold, and drag to draw.</li>
          <li>Twenty shapes, easy to hard. Tree then the Meta mark last. Stay on the line.</li>
          <li>Hit 90% or higher to unlock the next shape. Back pauses.</li>
        </ul>
        <button class="focusable" type="button" data-action="home">BACK</button>
      </div>
    </section>

    <section id="play" class="screen screen-play hidden" aria-label="Trace">
      <canvas id="hud" width="600" height="600"></canvas>
      <div id="pause-overlay" class="overlay hidden">
        <div class="panel">
          <h2>PAUSED</h2>
          <button class="focusable" type="button" data-action="resume">RESUME</button>
          <button class="focusable" type="button" data-action="quit">QUIT</button>
        </div>
      </div>
      <div id="score-overlay" class="overlay hidden">
        <div class="panel">
          <h2 id="score-title">TRACED</h2>
          <p id="score-readout" class="score-readout">72%</p>
          <p id="score-detail" class="score-detail">of the outline</p>
          <button id="next-btn" class="focusable" type="button" data-action="next">NEXT</button>
          <button class="focusable" type="button" data-action="retry">RETRY</button>
          <button class="focusable" type="button" data-action="quit">QUIT</button>
        </div>
      </div>
    </section>
  </div>
  <script src="app.js?v=12"></script>
</body>
</html>
