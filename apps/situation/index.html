<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=600, height=600, initial-scale=1.0, user-scalable=no">
  <meta name="description" content="Unofficial Monitor the Situation headline terminal for Meta Ray-Ban Display glasses. Data from monitor-the-situation.com; all credit to them.">
  <meta name="mrbd-web-app-capable" content="yes">
  <title>Monitoring the Situation v2</title>
  <link rel="icon" href="icon-96.png" sizes="96x96" type="image/png">
  <link rel="icon" href="favicon.png" sizes="192x192" type="image/png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png" sizes="180x180">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <section id="home" class="screen" aria-label="Monitoring the Situation">
      <header class="header">
        <div class="header-title-row">
          <h1>Monitoring the Situation</h1>
          <span class="clock header-meta">--:--</span>
        </div>
        <p class="source-credit">Unofficial. Data &amp; credit: monitor-the-situation.com</p>
        <span id="updated" class="header-meta">Updated --</span>
      </header>
      <div id="terminal" class="terminal" aria-live="polite"></div>
    </section>

    <section id="detail" class="screen hidden" aria-label="Headline detail">
      <header class="header header-compact">
        <h1 id="detail-pos">1 / 1</h1>
        <span class="clock header-meta">--:--</span>
      </header>
      <div id="detail-card" class="detail-card">
        <div id="detail-meta" class="row-meta"></div>
        <p id="detail-headline" class="detail-headline"></p>
        <p id="detail-summary" class="detail-summary"></p>
      </div>
      <button id="detail-back" class="focusable" type="button" data-action="home">Back</button>
    </section>
  </div>
  <script src="app.js"></script>
</body>
</html>
