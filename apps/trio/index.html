<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=600, height=600, initial-scale=1.0, user-scalable=no">
  <meta name="description" content="4x4 number slider: 1 and 2 make 3, then doubles. One space per swipe.">
  <meta name="mrbd-web-app-capable" content="yes">
  <title>TRIO v1</title>
  <link rel="icon" type="image/png" href="/meta_display/apps/trio/favicon.png">
  <link rel="icon" type="image/png" sizes="96x96" href="/meta_display/apps/trio/icon-96.png">
  <link rel="icon" type="image/png" sizes="128x128" href="/meta_display/apps/trio/icon-128.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/meta_display/apps/trio/favicon.png">
  <link rel="apple-touch-icon" href="/meta_display/apps/trio/apple-touch-icon.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/meta_display/apps/trio/apple-touch-icon.png">
  <link rel="manifest" href="/meta_display/apps/trio/manifest.webmanifest">
  <link rel="stylesheet" href="styles.css?v=1">
</head>
<body>
  <div id="app">
    <section id="home" class="screen" aria-label="TRIO title">
      <div class="title-block">
        <p class="title-tag">1 + 2 = 3</p>
        <h1>TRIO</h1>
        <p class="best-readout">BUILD v1</p>
        <p id="best-readout" class="best-readout">BEST 00000</p>
      </div>
      <div class="menu">
        <button class="focusable" data-action="play">PLAY</button>
        <button class="focusable" data-action="how">HOW</button>
      </div>
    </section>

    <section id="how" class="screen hidden" aria-label="How to play">
      <header class="header">
        <h1>HOW</h1>
      </header>
      <div class="content">
        <ul class="facts">
          <li>Swipe to slide every tile one space. Not across the board.</li>
          <li>Blue 1 and red 2 make 3. Matching 3s make 6, then 12, 24…</li>
          <li>A new tile enters from the other side. Play until nothing can move.</li>
        </ul>
        <button class="focusable" data-action="home">BACK</button>
      </div>
    </section>

    <section id="play" class="screen screen-play hidden" aria-label="Board">
      <canvas id="hud" width="600" height="600"></canvas>
      <button id="play-btn" class="focusable play-hotspot" data-action="hold" aria-label="Play"></button>
      <div id="pause-overlay" class="overlay hidden">
        <div class="panel">
          <h2>PAUSED</h2>
          <button class="focusable" data-action="resume">RESUME</button>
          <button class="focusable" data-action="quit">QUIT</button>
        </div>
      </div>
    </section>

    <section id="over" class="screen hidden" aria-label="No moves">
      <header class="header">
        <h1>LOCKED</h1>
      </header>
      <div class="content">
        <p id="over-stats" class="over-stats">SCORE 00000<br>BEST 00000</p>
        <button class="focusable" data-action="again">AGAIN</button>
        <button class="focusable" data-action="home">HOME</button>
      </div>
    </section>
  </div>
  <script src="app.js?v=1"></script>
</body>
</html>
