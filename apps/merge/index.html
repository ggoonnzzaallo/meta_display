<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=600, height=600, initial-scale=1.0, user-scalable=no">
  <meta name="description" content="6x6 2048: swipe to slide large tiles and merge them. A long learning-curve puzzle.">
  <meta name="mrbd-web-app-capable" content="yes">
  <title>MERGE v1</title>
  <link rel="icon" href="favicon.png" sizes="128x128" type="image/png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles.css?v=2">
</head>
<body>
  <div id="app">
    <section id="home" class="screen" aria-label="MERGE title">
      <div class="title-block">
        <p class="title-tag">6×6 · 2048</p>
        <h1>MERGE</h1>
        <p class="best-readout">BUILD v1</p>
        <p id="best-readout" class="best-readout">BEST 00000</p>
      </div>
      <div class="menu">
        <button class="focusable" data-action="play">PLAY</button>
        <button class="focusable" data-action="how">HOW</button>
      </div>
    </section>

    <section id="how" class="screen hidden" aria-label="How to play">
      <header class="header">
        <h1>HOW</h1>
      </header>
      <div class="content">
        <ul class="facts">
          <li>Swipe to slide. Matching numbers merge. Two new tiles appear after each move.</li>
          <li>Wait too long and another tile lands on its own.</li>
          <li>Pinch undoes a move. Keep going — there is no 2048 cap. Back pauses.</li>
        </ul>
        <button class="focusable" data-action="home">BACK</button>
      </div>
    </section>

    <section id="play" class="screen screen-play hidden" aria-label="Board">
      <canvas id="hud" width="600" height="600"></canvas>
      <button id="play-btn" class="focusable play-hotspot" data-action="undo" aria-label="Undo"></button>
      <div id="pause-overlay" class="overlay hidden">
        <div class="panel">
          <h2>PAUSED</h2>
          <button class="focusable" data-action="resume">RESUME</button>
          <button class="focusable" data-action="quit">QUIT</button>
        </div>
      </div>
    </section>

    <section id="over" class="screen hidden" aria-label="No moves">
      <header class="header">
        <h1>NO MOVES</h1>
      </header>
      <div class="content">
        <p id="over-stats" class="over-stats">SCORE 00000<br>BEST 00000</p>
        <button class="focusable" data-action="again">AGAIN</button>
        <button class="focusable" data-action="home">HOME</button>
      </div>
    </section>
  </div>
  <script src="app.js?v=2"></script>
</body>
</html>
