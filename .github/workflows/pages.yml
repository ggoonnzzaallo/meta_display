name: github-pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble public site
        run: |
          mkdir -p _site/apps
          cp .nojekyll index.html styles.css app.js favicon.png icon-96.png icon-128.png apple-touch-icon.png manifest.webmanifest _site/
          cp -R apps/. _site/apps/
          python3 scripts/fetch_feed.py --out _site/apps/situation/feed.json || echo "situation feed fetch failed, keeping seed"
          python3 scripts/fetch_markets.py --out _site/apps/markets/feed.json || echo "markets feed fetch failed, keeping seed"
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
